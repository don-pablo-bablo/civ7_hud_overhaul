name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Text keys
        run: node tools/check-text.mjs
      - name: Scripts parse
        run: for file in mod/*/ui/*.js tools/*.mjs; do node --check "$file" || exit 1; done
      - name: Build Pablo's Top Bar and Tooltips
        run: node tools/build-top-bar.mjs
